services:
  konficurator:
    build:
      context: .
      target: development
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./styles:/app/styles
      - ./samples:/app/samples
      - ./index.html:/app/index.html
      - ./parser-wasm/src:/app/parser-wasm/src
      - ./parser-wasm/Cargo.toml:/app/parser-wasm/Cargo.toml
      - /app/node_modules
      - /app/parser-wasm/target
      - /app/parser-wasm/pkg
  konficurator-prod:
    build:
      context: .
      target: production
    ports:
      - "8085:8080"
    profiles:
      - production
